[project]
name = "agentic-qa-platform"
version = "0.1.0"
description = "Master Testing Agent (MTA) — agent-evaluation service plus the legacy agentic QA CLI"
requires-python = ">=3.10"
# Keep in sync with requirements.txt (the install source of truth for the service).
dependencies = [
    "PyYAML>=6.0",
    "playwright>=1.40.0",
    "anthropic>=0.25.0",
    "google-genai>=1.30.0,<3",
    "google-adk[extensions]>=1.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Flat layout with several top-level packages — list them explicitly so setuptools'
# auto-discovery doesn't refuse to build (or sweep in frontend/, node_modules/, ...).
[tool.setuptools]
py-modules = ["main", "cli_appevolve", "exceptions"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "api*", "connectors*", "contracts*", "engines*", "tools*", "workflows*"]

[tool.pytest.ini_options]
markers = [
    "mta: MTA evaluation-stack test — the legacy agent stack is not imported (see tests/conftest.py)",
    "legacy: legacy CLI pipeline test (default for unmarked tests)",
]
