environment: local

connectors:
  llm: gemini    # aws | external | gemini | internal | openai | ollama — shared by every agent,
                 # including HealingAgent's ADK LlmAgent (see connectors/adk_model.py)

llm:
  gemini_model: "gemini-3.6-flash"         # every pipeline LLM call (env AQP_GEMINI_MODEL overrides)

adk:
  models:                                  # per-provider model id for HealingAgent's ADK LlmAgent.
    gemini: "gemini-3.6-flash"             # ADK's native model support — bare id, no prefix
    aws: "bedrock/us.anthropic.claude-sonnet-4-20250514-v1:0"   # via LiteLLM — prefix required
    external: "anthropic/claude-sonnet-4-6"                     # via LiteLLM
    openai: "openai/gpt-4o-mini"                                # via LiteLLM
    ollama: "ollama/llama3"                                     # via LiteLLM
  healing_max_iterations: 3

logging:
  level: INFO

workflow: full_workflow

execution:
  ns:
    base_url: "http://localhost:8000"   # NeuroStack server — update to point at new server
    auth_token_env: "NS_AUTH_TOKEN"     # env-var name; header omitted if absent
    connect_timeout: 10
    read_timeout: 120
    # Optional NeuroStack agent registry ({agents: {<name>: {method, endpoint, timeout}}}).
    # The file does not ship with the repo — when it is absent no step is
    # dispatched over NS and every ns_http fallback tier fails cleanly.
    registry: "workflows/ns_registry.yaml"
    agent_registry: "workflows/agent_registry.yaml"   # per-step fallback tiers (legacy CLI)
