# test_execution_and_healing.yaml — test_execution category, standalone
#
# Step 1: ui_execution — npx playwright test → Playwright JSON + HTML reports
# Step 2: healing      — heal failing test() blocks → block-level .spec.ts patching + blast radius
# Step 3: reporting    — Playwright JSON + test_suite.json → HTML + JSON reports
#
# Assumes test scripts already exist on disk (test_test_creation_only / full_workflow already ran).
# Same as full_workflow.yaml's last 3 steps, without discovery/testdata/semantic_map/script_generation.

steps:
  - name: ui_execution
    description: "Run npx playwright test — headless chromium, JSON + HTML reporters"
    # Inputs:   test_creation/test_scripts/*.spec.ts
    #           test_creation/test_suite.json
    #           playwright.config.ts
    # Outputs:  test_execution/reports/json/{ts}_results.json
    #           test_execution/reports/html/{ts}/
    #           test_execution/reports/index.json

  - name: triage
    description: "Classify every failed test (product_defect | test_defect.* | environment | flaky | known_issue | unknown) with evidence"
    depends_on: [ui_execution]
    # Phase 6.1 (agents/test_execution/triage). Re-runs: environment after a health check, failures --repeat-each=3;
    # an LLM only for what stays unknown, and only with quoted evidence.
    # Inputs:
    #   test_execution/reports/json/{ts}_results.json   (latest) + earlier reports (history)
    #   known_issues.yaml                         (project root, optional)
    #   project.yaml                              (healing.flaky_rerun / triage_llm, base URL)
    # Outputs:
    #   test_execution/reports/triage.json
    #   test_execution/reports/defects.json       (product_defect — never healed)

  - name: healing
    description: "Heal failing test() blocks — root cause + blast radius + block-level patch"
    depends_on: [triage]
    # Inputs:   test_execution/reports/json/{ts}_results.json
    #           comprehension/dom_elements.json
    #           test_creation/test_scripts/*.spec.ts
    # Outputs:  patched .spec.ts files
    #           test_creation/test_suite.json → status "healed"

  - name: reporting
    description: "Aggregate Playwright results + test_suite.json → HTML + JSON reports"
    always_run: true
    depends_on: [healing]
    # Inputs:   test_execution/reports/json/{ts}_results.json
    #           test_creation/test_suite.json
    # Outputs:  test_execution/reports/html/{ts}_{project}.html
    #           test_execution/reports/json/{ts}_{project}.json
    #           test_execution/reports/index.json
