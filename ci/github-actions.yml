# MTA quality pipeline for GitHub Actions — copy to .github/workflows/mta.yml.
# Set the repository variable MTA_PROJECT (a folder under application_assets/projects/) and, when the app under
# test must be started inside the job, APP_START_CMD (e.g. "docker compose up -d app").
#   pull request -> smoke + impacted tests, chromium
#   nightly      -> burn-in admission, whole suite on the browser matrix, order-independence check
#   release tag  -> whole suite + quality gates
# The job fails when a quality gate fails (exit 1) or the environment is down (exit 3).
# nightly-benchmark (Phase 12.5, MTA's own self-test; schedule or stage=benchmark): the benchmarks on buggy_shop,
# then tools.benchmark.regression_gate — fails when a detection rate drops, a false-failure rate rises or heal
# precision falls below 95% — plus the LLM eval replay, the prompt staleness check and deep property tests.
name: mta

on:
  pull_request:
  schedule:
    - cron: "0 1 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: "pr | nightly | release | benchmark"
        default: "nightly"

concurrency:
  group: mta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.stage != 'benchmark' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MTA_PROJECT: ${{ vars.MTA_PROJECT }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # selective execution diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start the app under test
        if: ${{ vars.APP_START_CMD != '' }}
        run: ${{ vars.APP_START_CMD }}
      - name: Pick the stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "stage=pr" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "schedule" ]; then echo "stage=nightly" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "push" ]; then echo "stage=release" >> "$GITHUB_OUTPUT";
          else echo "stage=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"; fi
      - name: Run MTA
        run: |
          EXTRA=""
          if [ "${{ steps.stage.outputs.stage }}" = "pr" ]; then EXTRA="--git-base origin/${{ github.base_ref }}"; fi
          if [ "${{ steps.stage.outputs.stage }}" = "nightly" ]; then EXTRA="--order-check"; fi
          python -m tools.ci.run --project "$MTA_PROJECT" --stage "${{ steps.stage.outputs.stage }}" $EXTRA
      - name: Upload reports (HTML, JSON, JUnit, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-${{ steps.stage.outputs.stage }}-reports
          path: |
            application_assets/projects/${{ env.MTA_PROJECT }}/test_execution/reports/
            application_assets/projects/${{ env.MTA_PROJECT }}/quarantine.yaml
          retention-days: 14
      - name: Publish JUnit
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: application_assets/projects/${{ env.MTA_PROJECT }}/test_execution/reports/junit/*.xml

  nightly-benchmark:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'benchmark') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Benchmarks (buggy_shop, real Chromium, no LLM spend)
        run: |
          python -m tools.benchmark.healing_bench
          python -m tools.benchmark.nfr_bench
          python -m tools.benchmark.whitebox_bench --mutants 12
          python -m tools.benchmark.ci_bench
      - name: Metric regression gates
        run: >-
          python -m tools.benchmark.regression_gate
          --require phase6_healing,phase7_nfr,phase8_whitebox,phase10_ci
      - name: LLM-agent evals (recorded replies) and prompt staleness
        if: always()
        run: |
          python -m tools.selftest.llm_evals --replay
          python -m tools.selftest.llm_evals --check-stale
      - name: Deep property tests
        if: always()
        env:
          MTA_HYPOTHESIS_EXAMPLES: "2000"
        run: python -m pytest tests/unit/test_phase12_properties.py -q
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-nightly-benchmark
          path: benchmarks/results/
          retention-days: 30
