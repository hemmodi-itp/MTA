# buggy_shop — hand-labelled acceptance-criteria ground truth (Phase 1 acceptance: >= 90% extracted).
#
# One entry per acceptance criterion the BRD (brd.md) states. `statement` is the BRD text verbatim.
# Labels are a tester's judgement, written by hand for this benchmark:
#   atomic / checks   false + the separate checkable behaviours when one criterion bundles several
#   testability       ui | api | non_functional | manual_only | not_testable
#   priority          P0 (unusable/unsafe without it) .. P3 (minor)
#   risk_tags         auth | payment | data-loss | PII | compliance
# tools/benchmark/ac_recall.py matches extracted criteria to these by TEXT (quote grounded in the statement,
# or >= 70% content-word support), never by id, so the --strip-ids run measures real extraction.
acceptance_criteria:
- id: AC-01.1
  req: REQ-01
  module: M01
  statement: Given valid credentials (for example `alice` / `alice-pass-1`), when the user submits the login form,
    then they land on the Products page.
  atomic: true
  testability: ui
  priority: P0
  risk_tags:
  - auth
- id: AC-01.2
  req: REQ-01
  module: M01
  statement: Given a wrong password or an unknown username, when the user submits the login form, then the page
    shows exactly "Invalid username or password" and does not reveal which part was wrong.
  atomic: true
  testability: ui
  priority: P1
  risk_tags:
  - auth
- id: AC-01.3
  req: REQ-01
  module: M01
  statement: 'When the user logs out, the session is invalidated on the server: afterwards every protected page
    redirects to the login page, even if the old session cookie is sent again.'
  atomic: true
  testability: ui
  priority: P1
  risk_tags:
  - auth
- id: AC-01.4
  req: REQ-01
  module: M01
  statement: Every field on the login form (Username, Password) has a visible label that is programmatically associated
    with its input (accessible name).
  atomic: true
  testability: non_functional
  priority: P2
  risk_tags:
  - compliance
- id: AC-02.1
  req: REQ-02
  module: M02
  statement: The product list is paginated with 5 products per page, with Previous/Next links and a "Page N of M"
    indicator.
  atomic: true
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-02.2
  req: REQ-02
  module: M02
  statement: Search matches any product whose name contains the search text, ignoring upper/lower case (for example
    "mouse" finds "wireless Mouse").
  atomic: true
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-02.3
  req: REQ-02
  module: M02
  statement: 'Sorting by price (low to high, or high to low) is stable: products with the same price keep their
    catalogue order (product id order, which is also their name order).'
  atomic: true
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-02.4
  req: REQ-02
  module: M02
  statement: A search containing any characters, including `%`, `_`, quotes or symbols, never causes an error; it
    simply returns the matching products or "No products found".
  atomic: true
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-02.5
  req: REQ-02
  module: M02
  statement: When a category filter (or search or sort) is active, the pagination links keep it, so page 2 still
    shows only the filtered products.
  atomic: true
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-02.6
  req: REQ-02
  module: M02
  statement: The product list (page and API) loads within 2 seconds.
  atomic: true
  testability: non_functional
  priority: P2
  risk_tags: []
- id: AC-03.1
  req: REQ-03
  module: M03
  statement: Name is required; an empty or blank name is rejected with "Name is required".
  atomic: true
  testability: ui
  priority: P1
  risk_tags: []
- id: AC-03.2
  req: REQ-03
  module: M03
  statement: Name must be 1–50 characters; a name of exactly 50 characters is accepted and 51 or more is rejected
    with "Name must be at most 50 characters".
  atomic: false
  checks:
  - a name of exactly 50 characters is accepted
  - a name of 51 or more characters is rejected with "Name must be at most 50 characters"
  testability: ui
  priority: P1
  risk_tags: []
- id: AC-03.3
  req: REQ-03
  module: M03
  statement: Price is required, numeric with at most 2 decimals, and must be zero or more; a negative price is rejected
    with "Price must be zero or more". The server enforces this too, including `POST /api/products`.
  atomic: false
  checks:
  - a negative price is rejected in the form with "Price must be zero or more"
  - the server rejects a negative price, including POST /api/products
  testability: ui
  priority: P1
  risk_tags:
  - payment
- id: AC-03.4
  req: REQ-03
  module: M03
  statement: Category must be one of Books, Electronics or Home ("Please choose a category"); Description is optional
    and at most 500 characters ("Description must be at most 500 characters").
  atomic: false
  checks:
  - Category must be one of Books, Electronics or Home ("Please choose a category")
  - Description is optional and at most 500 characters ("Description must be at most 500 characters")
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-03.5
  req: REQ-03
  module: M03
  statement: 'The product description is shown on the product detail page as plain text: any HTML or script in it
    is displayed literally and never executed.'
  atomic: true
  testability: ui
  priority: P1
  risk_tags: []
- id: AC-03.6
  req: REQ-03
  module: M03
  statement: Submitting the same product twice in quick succession (double click, or the same name and price within
    5 seconds) creates only one product; the Save button is disabled while saving.
  atomic: true
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-03.7
  req: REQ-03
  module: M03
  statement: 'When a product is deleted, the page confirms "Product deleted" and the product disappears permanently:
    it no longer appears in the list or search, and its detail page returns "Product not found", even after a reload.'
  atomic: true
  testability: ui
  priority: P1
  risk_tags:
  - data-loss
- id: AC-04.1
  req: REQ-04
  module: M05
  statement: Uploading a CSV or PNG file of at most 1 MB succeeds and shows "Uploaded <file name>".
  atomic: true
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-04.2
  req: REQ-04
  module: M05
  statement: Any other file type (for example `.exe`, `.txt`, `.pdf`) is rejected by the server with "Only CSV or
    PNG files are allowed"; files over 1 MB are rejected with "File must be 1 MB or smaller".
  atomic: false
  checks:
  - any other file type is rejected with "Only CSV or PNG files are allowed"
  - files over 1 MB are rejected with "File must be 1 MB or smaller"
  testability: ui
  priority: P2
  risk_tags: []
- id: AC-05.1
  req: REQ-05
  module: M04
  statement: Quantity must be a whole number from 1 to 99, both when adding from the product page and when updating
    the cart; anything else (0, negative, 100 or more, text) is rejected with "Quantity must be between 1 and 99".
  atomic: false
  checks:
  - quantity outside 1-99 is rejected when adding from the product page
  - quantity outside 1-99 is rejected when updating the cart
  testability: ui
  priority: P1
  risk_tags:
  - payment
- id: AC-05.2
  req: REQ-05
  module: M04
  statement: 'Line totals, subtotal, discount and total are calculated from exact amounts and rounded half up to
    2 decimals. Examples: 1 × Gel Pen at 1.005 gives a total of 1.01; 3 × Gel Pen gives 3.02; 1 × Atlas of Maps
    (19.95) with SAVE10 gives a total of 17.96 (17.955 rounded half up).'
  atomic: true
  testability: ui
  priority: P1
  risk_tags:
  - payment
- id: AC-05.3
  req: REQ-05
  module: M04
  statement: Discount code SAVE10 gives 10% off the cart and can be applied only once per cart; applying it again
    shows "Discount already applied" and the total does not change. Unknown codes show "Invalid discount code".
  atomic: false
  checks:
  - SAVE10 gives 10% off and can be applied only once per cart ("Discount already applied")
  - unknown codes show "Invalid discount code"
  testability: ui
  priority: P1
  risk_tags:
  - payment
- id: AC-05.4
  req: REQ-05
  module: M04
  statement: Checkout with an empty cart does not create an order; the checkout page shows "Your cart is empty".
  atomic: true
  testability: ui
  priority: P1
  risk_tags:
  - payment
- id: AC-06.1
  req: REQ-06
  module: M04
  statement: 'Placing an order from a non-empty cart opens the order confirmation page for the new order, showing
    "Order #<id>", the message "Thank you! Your order #<id> has been placed.", its lines and total; the cart is
    then empty.'
  atomic: true
  testability: ui
  priority: P1
  risk_tags:
  - payment
- id: AC-06.2
  req: REQ-06
  module: M04
  statement: Customers can see only their own orders. Opening another user's order (page `/orders/<id>` or `GET
    /api/orders/<id>`) returns HTTP 403 with "Access denied". Administrators can see every order.
  atomic: false
  checks:
  - a customer opening another user's order gets HTTP 403 "Access denied"
  - administrators can see every order
  testability: ui
  priority: P1
  risk_tags:
  - auth
- id: AC-07.1
  req: REQ-07
  module: M06
  statement: The Admin page (`/admin`, listing users and roles) is available only to administrators; any other signed-in
    user gets HTTP 403 with "Access denied".
  atomic: false
  checks:
  - administrators can open the Admin page
  - any other signed-in user gets HTTP 403 "Access denied"
  testability: ui
  priority: P1
  risk_tags:
  - auth
- id: AC-08.1
  req: REQ-08
  module: M02
  statement: Every page has a "Help" link in the footer that opens the Help page (`/help`), which is available without
    signing in.
  atomic: true
  testability: ui
  priority: P3
  risk_tags: []
