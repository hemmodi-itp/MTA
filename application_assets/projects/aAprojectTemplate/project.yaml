project:
  name: YourProjectName                  # matches folder name under application_assets/projects/
  application_name: Your Application     # human-readable app name (used in reports and LLM prompts)
  browser: chromium                       # chromium | firefox | webkit
  headless: false                         # false = visible browser; true = background (CI)
  interactive_scan: false
  discovery_timeout_s: 120                  # false = automated headless/headed crawl (no user input needed)
                                          # true  = user-guided session — you navigate, scanner records
                                          #         (start with: python main.py --project YourProjectName --record)

# ── Target environment + safety rails (Phase 0) ─────────────────────────────
# environment is how safe it is to act on the target: local | dev | staging | prod.
# Leaving it out is allowed but treated like prod (a warning is logged).
environment: dev

safety:
  allow_destructive: false       # delete / pay / send / transfer / deactivate / reset ... steps are
                                 # dropped (whole test, reported) unless true AND environment != prod
  allow_security_probes: false   # XSS / SQLi / traversal payloads in test data are dropped unless
                                 # true AND environment != prod (prod always refuses)
  # allowed_hosts: [yourapp.com, api.yourapp.com]
                                 # omit to allow only the hosts of this file's own URLs
                                 # (modules[].url, setup goto, auth URLs); navigation elsewhere fails the step

# ── Artifact contracts (Phase 0) ────────────────────────────────────────────
contracts:
  enforce: block                 # warn (default when omitted) | block — what a step's artifact
                                 # that breaks its schema does to the run

# ── Requirements & traceability (Phase 1) ───────────────────────────────────
requirements:
  enabled: true                  # false when omitted. On: BRD → requirements.json (REQ → atomic AC),
                                 # scenarios + tests linked to AC ids, Playwright tags (@P1 @AC-01.2 …),
                                 # test_creation/traceability.json and a traceability section in the report

# ── Deep discovery (Phase 2) ────────────────────────────────────────────────
discovery:
  deep: true                     # false when omitted. On: batched element capture (all frames, open shadow
                                 # roots, custom widgets, field constraints, container-scoped locators) plus a
                                 # project-level crawl → test_comprehension/app_map.json (states + transitions),
                                 # form_model.json (observed validation messages), api_inventory.json,
                                 # permission_matrix.json (per role) and baseline.json (console errors, timing)
  max_pages: 25                  # page visits per role
  max_depth: 4                   # link / expander hops from a module URL
  max_minutes: 10                # the whole deep pass, all roles
  # validation:                  # form probes: full in local/dev/staging; client-only (writes aborted) in prod
  #   enabled: true
  #   max_probes_per_form: 20
  #   long_text_length: 1000     # "too long" probe length when a field declares no maxlength

input:
  # Directory containing per-module BRD files.
  # Each module entry below references a brd_file relative to this directory.
  brd_dir: application_assets/projects/YourProjectName/inputs

# ── Auth — leave enabled: false if login is tested AS a module scenario ─────
# (that's the recommended default — see modules[].setup below for the usual
# way to get past a login screen before scanning/testing a page that sits
# behind it). Only enable this top-level block if you need a *pipeline-wide*
# authenticated session reused across every module via a saved storageState.
# After enabling, run:  python main.py --project YourProjectName --auth-setup
auth:
  enabled: false
  strategy: storageState                  # storageState = reuse saved session across runs
                                          # live_login   = re-authenticate on every pipeline run
  storage_state_path: application_assets/projects/YourProjectName/.auth/auth.json
  # roles:                                # Phase 2 role-aware discovery — read even when enabled: false.
  #   admin:                              # one crawl per role, diffed into permission_matrix.json
  #     strategy: credentials             # live login; credentials come from env vars only
  #     login_url: https://yourapp.com/login
  #     username_env: ADMIN_USER
  #     password_env: ADMIN_PASS
  #     username_selector: "#username"
  #     password_selector: "#password"
  #     submit_selector: "#login-button"
  #     success_url: https://yourapp.com/dashboard
  #   user:
  #     strategy: storageState
  #     storage_state_path: application_assets/projects/YourProjectName/.auth/user.json
  #   member:
  #     strategy: setup                   # the same goto/fill/click/wait steps as modules[].setup
  #     steps: [{goto: https://yourapp.com/login}, {fill: {selector: "#username", value_env: MEMBER_USER}}]
  #   guest:
  #     anonymous: true


modules:
  - id: M01
    name: Module One Name           # e.g. Login, Dashboard, Search, Checkout
    url: https://yourapp.com/       # URL discovery scans and every generated spec in this module navigates to
    brd_file: module_01_name.md     # BRD file inside inputs/ for this module

  - id: M02
    name: Module Two Name
    url: https://yourapp.com/page2
    brd_file: module_02_name.md
    # setup: a sequence of goto/fill/click/wait steps run BEFORE both (1) the
    # discovery DOM scan of `url` above, and (2) every generated .spec.ts file
    # for this module (injected as a shared test.beforeAll hook) — the one
    # place to describe "how do I get to a usable state" (typically a login)
    # once, and have it apply everywhere this module is used.
    #
    # fill supports either a literal `value`, or `value_env` to pull a secret
    # from an environment variable (.env) — never commit real credentials
    # into project.yaml or generated test scripts.
    #
    # setup:
    #   - goto: https://yourapp.com/login
    #   - fill:
    #       selector: "#username"
    #       value_env: YOURPROJECT_USERNAME
    #   - fill:
    #       selector: "#password"
    #       value_env: YOURPROJECT_PASSWORD
    #   - click: "#login-button"
    #   - wait: 2000

  # Add more modules as your coverage grows:
  # - id: M03
  #   name: Module Three Name
  #   url: https://yourapp.com/page3
  #   brd_file: module_03_name.md


test_generation:
  max_negative_cases: 1     # 0 disables negative-case generation entirely
  max_boundary_cases: 1     # 0 disables boundary-case generation entirely
  max_data_iterations: 3    # alternate value sets tried within each negative/boundary test

test_execution:
  suite: YourProjectName

# ── Suites (optional) — named scenario groupings for `--suite` ──────────────
# Define suites under test_suites/*.json (see test_suites/test_suites.md),
# then run one with:
#   python main.py --project YourProjectName --suite smoke
# Suite scenario lists accept any spec_id scheme the pipeline has produced —
# legacy hyphenated ("BS-001") or the current module-scoped ("M03_BS_006").
